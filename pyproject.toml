[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hftlab"
version = "0.1.0"
description = "Parallel and GPU-Accelerated High-Frequency Trading Simulation Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Parallel and GPU-Accelerated High-Frequency Trading Simulation Engine contributors"}]
dependencies = ["textual==0.89.1", "rich==13.9.4", "psutil==6.1.1", "PyYAML==6.0.2"]

[project.optional-dependencies]
science = ["numpy==2.2.6", "scikit-learn==1.6.1", "matplotlib==3.10.1", "plotly==5.24.1"]
torch = ["torch==2.6.0"]
parquet = ["pyarrow==19.0.1"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.11.13", "build==1.2.2.post1", "cmake==3.31.6", "ninja==1.11.1.4"]

[project.scripts]
hftlab = "hftlab.cli:main"

[tool.setuptools.packages.find]
include = ["hftlab*"]

[tool.setuptools.package-data]
"hftlab.tui" = ["*.tcss", "styles/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["native: requires the compiled C runner", "gpu: requires CUDA hardware", "mpi: requires MPI", "performance: measured smoke benchmarks"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["temp", "build", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
